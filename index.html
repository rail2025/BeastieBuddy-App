<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeastieBuddy App</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <header id="titlebar">
        <div class="title drag-region" data-tauri-drag-region>BeastieBuddy</div>
        <div class="window-controls">
          <span id="btn-pin" title="Always on Top">📌</span>
          <span id="btn-minimize" title="Minimize">≡</span>
          <span id="btn-shade" title="Roll Up/Down">▼</span>
          <span id="btn-close" title="Close">✕</span>
        </div>
      </header>
      
      <div id="opacity-menu" class="hidden">
        <label for="opacity-slider">Opacity:</label>
        <input type="range" id="opacity-slider" min="0.2" max="1.0" step="0.1" value="1.0">
      </div>

      <nav id="tabs">
        <button id="tab-search" class="active">Beastie Search</button>
        <button id="tab-blu">Blue Mage Spellbook</button>
        <button id="tab-bestiary-v2">Bestiary</button>
        <div style="flex-grow: 1;"></div>
        <button id="btn-settings">Settings</button>
        <button id="btn-about">About</button>
      </nav>
      
      <div id="view-search" style="display:flex; flex-direction:column; flex-grow:1; overflow:hidden;">
        <div id="search-row">
          <input type="text" id="search-input" value="" placeholder="Search..." autocomplete="off" />
        </div>
        
        <main id="results-container"></main>
      </div>

      <div id="view-blu" class="hidden" style="display:flex; flex-direction:column; flex-grow:1; overflow:hidden;"></div>
      <div id="view-bestiary-v2" class="hidden" style="display:flex; flex-direction:column; flex-grow:1; overflow:hidden;"></div>
      <footer id="status-bar">
        Search for a beastie to get tips!
      </footer>
    </div>
  </body>
</html>
