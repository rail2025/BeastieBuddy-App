<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeastieBuddy App</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <header id="titlebar">
        <div class="title drag-region" data-tauri-drag-region>BeastieBuddy</div>
        <div class="window-controls">
          <span id="btn-pin" title="Always on Top">📌</span>
          <span id="btn-minimize" title="Minimize">≡</span>
          <span id="btn-shade" title="Roll Up/Down">▼</span>
          <span id="btn-close" title="Close">✕</span>
        </div>
      </header>
      
      <div id="opacity-menu" class="hidden">
        <label for="opacity-slider">Opacity:</label>
        <input type="range" id="opacity-slider" min="0.2" max="1.0" step="0.1" value="1.0">
      </div>

      <nav id="tabs">
        <button class="active">Beastie Search</button>
        <button>Blue Mage Spellbook</button>
        <button>Bestiary</button>
        <button>Bestiary V2</button>
      </nav>
      
      <div id="search-row">
        <input type="text" id="search-input" value="" placeholder="Search..." autocomplete="off" />
        <button>Settings</button>
        <button>About</button>
      </div>
      
      <main id="results-container">
      </main>
      
      <footer id="status-bar">
        Search for a beastie to get tips!
      </footer>
    </div>
  </body>
</html>
