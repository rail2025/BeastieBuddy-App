<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeastieBuddy Configuration</title>
  <link rel="stylesheet" href="/src/settings.css" />
  <script type="module" src="/src/settings.ts" defer></script>
</head>
<body>
  <header id="titlebar">
    <div class="title drag-region" data-tauri-drag-region>BeastieBuddy Configuration</div>
    <div class="window-controls">
      <span id="btn-close" title="Close">✕</span>
    </div>
  </header>
  <div class="content">
    <div class="section-title">Window Settings</div>
    <label class="check-row">
      <input type="checkbox" id="setting-theme" /> Light Theme
    </label>
    <label class="check-row">
      <input type="checkbox" id="setting-pin" /> Always on Top
    </label>
    <div class="slider-row">
      <label for="setting-opacity">Opacity:</label>
      <input type="range" id="setting-opacity" min="0.2" max="1.0" step="0.1" value="1.0" />
    </div>
  </div>
</body>
</html>
